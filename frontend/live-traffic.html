        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-surface-container-low text-tertiary-fixed-dim text-xs font-mono">

            <span class="relative inline-flex rounded-full h-2 w-2 bg-tertiary-container"></span>

        </span>
      </div>
      <p class="text-sm text-on-surface-variant">Real-time telemetry from edge nodes across all regions</p>
    </div>

      <div class="bg-surface-container-low p-4 rounded-xl border border-outline-variant/20">
        <div class="flex items-center justify-between mb-2">

        </div>

          <div class="flex justify-between"><span class="text-outline">Throughput</span><span class="text-on-surface">2,142/s</span></div>

      </div>
      <div class="bg-surface-container-low p-4 rounded-xl border border-outline-variant/20">

        <div class="text-sm font-semibold text-on-surface">Singapore</div>
        <div class="mt-3 pt-3 border-t border-outline-variant/20 space-y-1 text-[10px] font-mono">

        <div class="text-sm font-semibold text-on-surface">London</div>
        <div class="mt-3 pt-3 border-t border-outline-variant/20 space-y-1 text-[10px] font-mono">

          <circle cx="850" cy="75" fill="#00f0ff" r="4"></circle>

    <div class="bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/20">
      <div class="p-4 bg-surface-container flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-base">terminal</span>
          <span class="text-lg font-medium text-on-surface">Live Event Stream</span>
          <span class="bg-surface-container-lowest text-on-surface-variant text-[10px] font-mono px-2 py-0.5 rounded">STDOUT (JSONL)</span>

        <span class="text-xs font-mono text-outline">Auto-scroll: <span class="text-tertiary">ON</span></span>

              <th class="py-2.5 px-4">Shortlink</th>
              <th class="py-2.5 px-4">Edge PoP</th>
              <th class="py-2.5 px-4">Latency</th>
              <th class="py-2.5 px-4">Status</th>
            </tr>
          </thead>
          <tbody id="stream-body" class="font-mono text-xs">

          WebSocket: wss://stream.edgelink.io/live (Connected)
        </span>
        <span>Buffer: <span id="buffer-count">0</span> events</span>
      </div>
    </div>
