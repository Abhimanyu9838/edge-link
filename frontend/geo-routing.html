          <button id="run-sim-btn" class="w-full bg-primary-container text-on-primary font-medium py-2.5 rounded-lg hover:bg-primary-fixed-dim transition flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-base">play_arrow</span>
            <span>Execute Test</span>
          </a>
        </div>

        <div class="bg-surface-container-lowest p-4 rounded-lg space-y-2 text-xs font-mono">
          <div class="flex items-center justify-between pb-2 border-b border-outline-variant/20">
            <span class="text-outline uppercase">Resolved Trace</span>
            <span class="text-tertiary-fixed-dim" id="sim-status">MATCH_FOUND</span>
          </div>
          <div class="flex justify-between py-1">
            <span class="text-outline">Origin</span>
            <span class="text-on-surface font-medium" id="sim-origin">India (AS55836)</span>
          </div>
          <div class="flex justify-between py-1">
            <span class="text-outline">Matched Rule</span>
            <span class="text-primary-container font-semibold" id="sim-rule">Rule #1 (India)</span>
          </div>
          <div class="py-1">
            <span class="text-outline block mb-1">Redirect Target</span>
            <span class="text-primary-fixed-dim bg-surface-container px-2 py-1 rounded block truncate" id="sim-target">https://example.in/product</span>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-outline-variant/20">
            <div class="bg-surface-container p-2 rounded">
              <span class="text-outline block text-[10px]">Edge PoP</span>
              <span class="text-on-surface font-medium" id="sim-pop">BOM-1</span>
            </div>
            <div class="bg-surface-container p-2 rounded">
              <span class="text-outline block text-[10px]">TTFB</span>
              <span class="text-tertiary font-medium" id="sim-latency">22ms</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>


<script src="js/api.js"></script>
<script src="js/geo-routing.js"></script>
</body>
</html>
