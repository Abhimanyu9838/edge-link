<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EdgeLink — Links</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface-container": "#1e2024",
        "surface-container-high": "#282a2e",
        "surface-container-low": "#1a1c20",
        "surface-container-lowest": "#0c0e12",
        "surface-container-highest": "#333539",
        "on-surface": "#e2e2e8",
        "on-surface-variant": "#b9cacb",
        "outline": "#849495",
        "outline-variant": "#3b494b",
        "primary": "#dbfcff",
        "on-primary": "#00363a",
        "primary-container": "#00f0ff",
        "primary-fixed": "#7df4ff",
        "primary-fixed-dim": "#00dbe9",
        "secondary": "#d0bcff",
        "tertiary": "#d8ffe7",
        "tertiary-container": "#65f2b5",
        "tertiary-fixed": "#6ffbbe",
        "tertiary-fixed-dim": "#4edea3",
        "surface": "#111318",
        "background": "#111318",
        "error": "#ffb4ab"
      },
      fontFamily: {
        "body-md": ["Geist", "system-ui", "sans-serif"],
        "headline-sm": ["Geist", "system-ui", "sans-serif"],
        "headline-md": ["Geist", "system-ui", "sans-serif"],
        "headline-lg": ["Geist", "system-ui", "sans-serif"],
        "code-sm": ["JetBrains Mono", "monospace"],
        "code-md": ["JetBrains Mono", "monospace"],
        "label-md": ["Geist", "system-ui", "sans-serif"],
        "label-mono": ["JetBrains Mono", "monospace"]
      }
    }
  }
};
</script>

<link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-surface text-on-surface antialiased">
<button class="mobile-menu-btn" onclick="document.querySelector('aside').classList.toggle('open')"><span class="material-symbols-outlined">menu</span></a>

<!-- SIDEBAR -->
<aside class="fixed left-0 top-0 h-full w-[260px] bg-surface-container-lowest z-50 flex flex-col">
  <div class="h-16 px-4 flex items-center justify-between border-b border-outline-variant/30">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-surface-container border border-primary-container/50 flex items-center justify-center">
        <span class="material-symbols-outlined text-primary-container text-lg">bolt</span>
      </div>
      <span class="text-primary font-bold text-lg tracking-tight">Edge<span class="text-primary-container">Link</span></span>
    </div>
    <span class="text-[10px] font-mono bg-surface-container text-primary-fixed-dim px-2 py-0.5 rounded">v2.4</span>
  </div>

  <div class="p-3 border-b border-outline-variant/30">
    <button class="w-full flex items-center justify-between px-3 py-2 rounded-lg bg-surface-container hover:bg-surface-container-high transition">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-tertiary-container animate-pulse"></span>
        <div class="flex flex-col text-left">
          <span class="text-xs font-medium text-on-surface">Production</span>
          <span class="text-[10px] font-mono text-on-surface-variant">edge-ap-south</span>
        </div>
      </div>
      <span class="material-symbols-outlined text-on-surface-variant text-base">unfold_more</span>
    </a>
  </div>

  <nav class="flex-1 overflow-y-auto p-3 space-y-4">
    <div>
      <span class="px-2 text-[10px] font-mono text-outline uppercase tracking-wider">Platform</span>
      <div class="mt-2 flex flex-col gap-0.5">
        <a href="index.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface text-sm transition">
          <span class="material-symbols-outlined text-lg">dashboard</span><span>Overview</span>
        </a>
        <a href="links.html" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-surface-container-high text-primary-fixed font-medium text-sm">
          <span class="material-symbols-outlined text-lg">link</span><span>Links</span>
        </a>
        <a href="geo-routing.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface text-sm transition">
          <span class="material-symbols-outlined text-lg">alt_route</span><span>Geo Routing</span>
        </a>
        <a href="live-traffic.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface text-sm transition">
          <span class="material-symbols-outlined text-lg">monitoring</span><span>Analytics</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="p-3 border-t border-outline-variant/30">
    <div class="flex items-center gap-2 p-2 rounded-lg bg-surface-container">
      <div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center">
        <span class="material-symbols-outlined text-primary-container text-base">person</span>
      </div>
      <div class="flex flex-col flex-1">
        <span class="text-xs font-medium text-on-surface">Abhimanyu</span>
        <span class="text-[10px] font-mono text-on-surface-variant">Admin</span>
      </div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="pl-[260px]">
  <header class="fixed top-0 left-[260px] right-0 h-16 bg-surface/80 backdrop-blur-xl z-40 flex items-center justify-between px-6 border-b border-outline-variant/20">
    <div class="flex items-center gap-2 bg-surface-container-lowest px-3 py-2 rounded-lg w-96">
      <span class="material-symbols-outlined text-on-surface-variant text-base">search</span>
      <input id="search-input" class="bg-transparent text-sm text-on-surface outline-none w-full placeholder:text-outline" placeholder="Search by code or URL..."/>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="loadLinks()" class="flex items-center gap-1 bg-surface-container hover:bg-surface-container-high text-on-surface text-sm px-4 py-2 rounded-lg transition">
        <span class="material-symbols-outlined text-base">refresh</span><span>Refresh</span>
      </a>
      <a href="index.html#shorten" class="flex items-center gap-1 bg-primary-container text-on-primary text-sm font-semibold px-4 py-2 rounded-lg hover:bg-primary-fixed-dim transition shadow-[0_0_12px_rgba(0,240,255,0.35)]">
        <span class="material-symbols-outlined text-base">add</span><span>Create Link</span>
      </a>
    </div>
  </header>

  <main class="pt-20 px-6 pb-12">
    <div class="mb-6 flex items-end justify-between">
      <div>
        <div class="flex items-center gap-3 mb-1">
          <h1 class="text-3xl font-semibold text-on-surface tracking-tight">Your Links</h1>
          <span class="text-[10px] font-mono bg-surface-container-high text-primary-fixed px-2 py-0.5 rounded">EDGE REGISTRY</span>
        </div>
        <p class="text-sm text-on-surface-variant"><span id="links-count">0</span> active shortened links</p>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="bg-surface-container-lowest rounded-xl p-3 mb-4 border border-outline-variant/20">
      <div class="flex items-center gap-3">
        <div class="flex-1 flex items-center bg-surface-container-low px-3 py-2 rounded-lg gap-2">
          <span class="material-symbols-outlined text-on-surface-variant text-base">search</span>
          <input id="table-search" class="bg-transparent text-sm text-on-surface outline-none w-full font-mono placeholder:text-outline" placeholder="Filter by code..."/>
        </div>
        <button class="flex items-center gap-1 bg-surface-container-low hover:bg-surface-container px-3 py-2 rounded-lg text-xs text-on-surface transition">
          <span class="text-outline">Sort:</span><span>Most Clicks</span>
          <span class="material-symbols-outlined text-sm">swap_vert</span>
        </a>
      </div>
    </div>

    <!-- TABLE -->
    <div class="bg-surface-container-lowest rounded-xl overflow-hidden border border-outline-variant/20">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead>
            <tr class="bg-surface-container-low text-on-surface-variant text-[11px] font-mono uppercase tracking-wider">
              <th class="py-3 px-5 font-semibold">Short URL</th>
              <th class="py-3 px-5 font-semibold">Destination</th>
              <th class="py-3 px-5 font-semibold text-right">Clicks</th>
              <th class="py-3 px-5 font-semibold">Created</th>
              <th class="py-3 px-5 font-semibold">Status</th>
              <th class="py-3 px-5 font-semibold text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="links-tbody" class="text-sm">
            <tr>
              <td colspan="6" class="py-12 text-center text-outline text-sm">
                <span class="material-symbols-outlined text-4xl mb-2 block">cloud_sync</span>
                Loading links...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="bg-surface-container-low px-5 py-3 flex items-center justify-between text-xs text-on-surface-variant border-t border-outline-variant/20">
        <span>Showing <strong id="showing-count" class="text-on-surface">0</strong> links</span>
        <span class="font-mono text-tertiary">Registry synced</span>
      </div>
    </div>
  </main>
</div>


<script src="js/api.js"></script>
<script src="js/links.js"></script>
</body>
</html>
